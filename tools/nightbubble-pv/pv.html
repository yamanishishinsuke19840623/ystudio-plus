<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナイトバブル 15秒PV（絵コンテ兼描画）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#222;color:#eee;font:14px system-ui;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  canvas{width:360px;height:640px;background:#000}
  input{width:360px}
</style>
</head>
<body>
<!-- 1080x1920（縦）。ブラウザで開くとスライダーで確認できる。render.mjs は window.renderAt(秒) を1コマずつ呼ぶ -->
<canvas id="v" width="1080" height="1920"></canvas>
<input id="t" type="range" min="0" max="15" step="0.02" value="0"><span id="tl">0.00s</span>
<script>
// ── 絵コンテ（96BPM・1小節2.5秒・6小節＝15秒。場面の切り替えは小節の頭）──
//  1  0.0–2.5  スマッシュカット : 月のロゴ → 泡が拍で2回ぷくっ → 「パチン！」→ 小節頭で一気に本編
//  2  2.5–5.0  ドリーイン       : 夜空に噴き上がる泡（縦の写真・お月見2024）に寄る ＋「はじめての／夜に、なる。」
//  3  5.0–7.5  ホイップパン     : 子どもたちの写真2枚を、ブレながら横に振って切り替え ＋「子どもから大人まで、」
//  4  7.5–10   クレーンアップ   : 校庭の輪の写真が下から昇る ＋ スピードランプの数字（20回以上・5,000人以上・13会場）
//  5  10–12.5  ラックフォーカス : ぼけた夜空の泡にピントが合う ＋「その夜を、きっとずっと覚えてる。」
//  6  12.5–15  締め             : ロゴ・「学校・PTA・地域イベントへ」・「お気軽に、カオスやストリートのインスタグラムDMへ」→ フェードアウト
// 文言はすべて /nightbubble/ のページに載っている事実・言葉から。
const W = 1080, H = 1920, BAR = 2.5, BEAT = BAR / 4;
window.DURATION = 15;
const C = { night: "#07090f", paper: "#f3eee3", ink: "#15161a", moon: "#ffcf3a", logo: "#010c26" };
const cv = document.getElementById("v"), x = cv.getContext("2d");
const IMG = {};
const SRC = { moon: "moon.jpg", logo: "logo.jpg", moon3: "moon3.jpg", crowd: "crowd.jpg", reach: "reach.jpg", ring: "ring.jpg", moon1: "moon1.jpg", ojisan: "ojisan.jpg" };
window.ready = Promise.all(Object.entries(SRC).map(([k, f]) => new Promise((ok) => {
  const i = new Image();
  i.onload = () => { IMG[k] = i; ok(); };
  i.src = "../../nightbubble/img/" + f;
}))).then(() => Promise.all(["900 150px 'Zen Maru Gothic'", "700 60px 'Zen Maru Gothic'", "40px 'Yusei Magic'"].map((f) => document.fonts.load(f, "夜はじめての"))));

// ── 道具 ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const range = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const back = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
// ばね（0→1 を行き過ぎてから止まる）
const spring = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(11 * p));
function rnd(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }

function cover(img, s = 1, ox = 0, oy = 0, blur = 0, dark = 0) {
  const k = Math.max(W / img.width, H / img.height) * s;
  const w = img.width * k, h = img.height * k;
  x.save();
  if (blur) x.filter = `blur(${blur}px)`;
  x.drawImage(img, (W - w) / 2 + ox, (H - h) / 2 + oy, w, h);
  x.restore();
  if (dark) { x.fillStyle = `rgba(0,0,0,${dark})`; x.fillRect(0, 0, W, H); }
}
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
// ステッカー風の写真カード（太い枠＋ずらした黄色の影）
function card(img, cx, cy, w, h, rot = 0, blur = 0) {
  x.save();
  x.translate(cx, cy);
  x.rotate(rot);
  rr(-w / 2 + 22, -h / 2 + 22, w, h, 40); x.fillStyle = C.moon; x.fill();
  rr(-w / 2, -h / 2, w, h, 40); x.save(); x.clip();
  const k = Math.max(w / img.width, h / img.height);
  if (blur) x.filter = `blur(${blur}px)`;
  x.drawImage(img, -img.width * k / 2, -img.height * k / 2, img.width * k, img.height * k);
  x.restore();
  rr(-w / 2, -h / 2, w, h, 40); x.lineWidth = 9; x.strokeStyle = C.paper; x.stroke();
  x.restore();
}
// 文字：太い黒ふち＋塗り。scale で「ぽんっ」と出す
function text(s, px, py, size, { color = C.paper, a = 1, scale = 1, align = "center", font = "900", fam = "Zen Maru Gothic", stroke = true, rot = 0 } = {}) {
  if (a <= 0) return;
  x.save();
  x.globalAlpha = a;
  x.translate(px, py);
  x.rotate(rot);
  x.scale(scale, scale);
  x.font = `${font} ${size}px '${fam}'`;
  x.textAlign = align;
  x.textBaseline = "middle";
  x.lineJoin = "round";
  if (stroke) { x.lineWidth = size * 0.16; x.strokeStyle = C.ink; x.strokeText(s, 0, 0); }
  x.fillStyle = color;
  x.fillText(s, 0, 0);
  x.restore();
}
// 1行の中で色を変える（[文字, 色] の配列）
function richText(parts, px, py, size, opt = {}) {
  x.save();
  x.font = `900 ${size}px 'Zen Maru Gothic'`;
  const ws = parts.map(([s]) => x.measureText(s).width), total = ws.reduce((a, b) => a + b, 0);
  x.restore();
  let cx = px - total / 2;
  parts.forEach(([s, col], i) => { text(s, cx + ws[i] / 2, py, size, { ...opt, color: col }); cx += ws[i]; });
}
// シャボン玉
function bubble(bx, by, r, a = 1) {
  if (r <= 0 || a <= 0) return;
  x.save();
  x.globalAlpha = a;
  const g = x.createRadialGradient(bx, by, r * 0.55, bx, by, r);
  g.addColorStop(0, "rgba(255,255,255,0.02)");
  g.addColorStop(1, "rgba(255,255,255,0.28)");
  x.beginPath(); x.arc(bx, by, r, 0, Math.PI * 2); x.fillStyle = g; x.fill();
  const cg = x.createConicGradient(0.7, bx, by);
  ["#7ff3ff", "#ff9be4", "#fff59a", "#9dffb5", "#7ff3ff"].forEach((c, i) => cg.addColorStop(i / 4, c));
  x.lineWidth = Math.max(1.5, r * 0.045); x.strokeStyle = cg; x.globalAlpha = a * 0.75; x.stroke();
  x.globalAlpha = a * 0.7;
  x.beginPath(); x.ellipse(bx - r * 0.35, by - r * 0.38, r * 0.16, r * 0.09, -0.7, 0, Math.PI * 2); x.fillStyle = "#fff"; x.fill();
  x.restore();
}
// 画面に漂う小さな泡（時間で決まるので何度描いても同じ）
function floaters(t, n = 16, a = 0.8, seed = 7) {
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const bx = r() * W, speed = 60 + r() * 120, rad = 14 + r() * 46, ph = r() * 10;
    const by = H + 80 - ((t * speed + ph * 200) % (H + 200));
    bubble(bx + Math.sin(t * 1.3 + ph) * 30, by, rad, a);
  }
}
function stars(t, dy = 0) {
  const r = rnd(3);
  for (let i = 0; i < 90; i++) {
    const sx = r() * W, sy = (r() * H + dy) % H, s = 1 + r() * 2.5;
    x.globalAlpha = 0.35 + 0.35 * Math.sin(t * 3 + i);
    x.fillStyle = "#fff"; x.fillRect(sx, sy, s, s);
  }
  x.globalAlpha = 1;
}
function tag(s, px, py, a = 1, scale = 1) {
  if (a <= 0) return;
  x.save();
  x.globalAlpha = a;
  x.translate(px, py); x.scale(scale, scale); x.rotate(-0.04);
  x.font = "900 50px 'Zen Maru Gothic'";
  const w = x.measureText(s).width + 80;
  rr(-w / 2 + 8, -44 + 8, w, 88, 44); x.fillStyle = C.ink; x.fill();
  rr(-w / 2, -44, w, 88, 44); x.fillStyle = C.moon; x.fill(); x.lineWidth = 6; x.strokeStyle = C.ink; x.stroke();
  x.fillStyle = C.ink; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(s, 0, 3);
  x.restore();
}
// 2行のステッカー
function tag2(lines, px, py, a = 1, scale = 1) {
  if (a <= 0) return;
  x.save();
  x.globalAlpha = a;
  x.translate(px, py); x.scale(scale, scale); x.rotate(-0.035);
  x.font = "900 62px 'Zen Maru Gothic'";
  const w = Math.max(...lines.map((l) => x.measureText(l).width)) + 100, h = lines.length * 82 + 44;
  rr(-w / 2 + 10, -h / 2 + 10, w, h, 40); x.fillStyle = C.ink; x.fill();
  rr(-w / 2, -h / 2, w, h, 40); x.fillStyle = C.moon; x.fill(); x.lineWidth = 7; x.strokeStyle = C.ink; x.stroke();
  x.fillStyle = C.ink; x.textAlign = "center"; x.textBaseline = "middle";
  lines.forEach((l, i) => x.fillText(l, 0, (i - (lines.length - 1) / 2) * 82 + 3));
  x.restore();
}
const pop = (t, at, d = 0.35) => ({ a: range(t, at, at + 0.12), scale: back(range(t, at, at + d)) });

// ── 各場面 ──
function s1(t) {
  // スマッシュカット：静かな前振り
  x.fillStyle = C.logo; x.fillRect(0, 0, W, H);
  stars(t);
  const m = IMG.moon, mw = 860, mh = mw * m.height / m.width;
  x.save();
  x.globalAlpha = range(t, 0, 0.5) * (t > 1.875 ? 1 - range(t, 1.875, 2.2) * 0.5 : 1);
  const mg = x.createRadialGradient(W / 2, 700, 0, W / 2, 700, mw * 0.55);
  x.drawImage(m, (W - mw) / 2, 700 - mh / 2, mw, mh);
  x.restore();
  // 泡：拍（0.625・1.25）で2回ぷくっ、1.875 でパチン
  const cx = W / 2, cy = 1260;
  let r = 0;
  if (t < 0.625) r = 90 * spring(range(t, 0.2, 0.6));
  else if (t < 1.25) r = 90 + 70 * back(range(t, 0.625, 0.95));
  else r = 160 + 90 * back(range(t, 1.25, 1.6));
  const sq = t < 1.875 ? Math.sin((t % BEAT) / BEAT * Math.PI) * 0.06 : 0;
  if (t < 1.875) {
    x.save(); x.translate(cx, cy); x.scale(1 + sq, 1 - sq); bubble(0, 0, r, 1); x.restore();
  } else {
    // しぶき
    const p = range(t, 1.875, 2.35), rr2 = rnd(11);
    for (let i = 0; i < 22; i++) {
      const ang = (i / 22) * Math.PI * 2 + rr2() * 0.3, dist = 250 * easeOut(p) * (0.7 + rr2() * 0.6);
      x.globalAlpha = 1 - p; x.fillStyle = i % 3 ? "#fff" : C.moon;
      x.beginPath(); x.arc(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist, 10 * (1 - p) + 3, 0, Math.PI * 2); x.fill();
    }
    x.globalAlpha = 1;
    const q = pop(t, 1.875, 0.3);
    text("パチン！", cx, cy, 190, { color: C.moon, ...q, rot: -0.06 });
  }
}
function s2(t) {
  // ドリーイン：噴き上がる泡に寄っていく
  const p = range(t, 2.5, 5);
  cover(IMG.moon3, 1.02 + 0.16 * easeInOut(p), 0, -40 * p);
  const g = x.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.75)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  floaters(t, 10, 0.7);
  tag("下関 ナイトバブルショー", W / 2, 260, range(t, 2.6, 2.75), back(range(t, 2.6, 2.95)));
  text("はじめての", W / 2, 1360, 150, pop(t, 2.5 + BEAT));
  richText([["夜", C.moon], ["に、なる。", C.paper]], W / 2, 1540, 160, pop(t, 2.5 + BEAT * 2));
}
function s3(t) {
  // ホイップパン：横に振って、ブレで次の写真へ
  x.fillStyle = C.night; x.fillRect(0, 0, W, H);
  stars(t);
  floaters(t, 12, 0.55, 21);
  const cut = 6.25, cw = 960, ch = 680, cy = 840;
  // 1枚目: 5.0–5.2 で右から入り、6.05–6.25 で左へ振り抜ける。2枚目: 6.25–6.45 で右から入る
  const swing = (a, b) => easeInOut(range(t, a, b));
  let ax, bx;
  const inA = swing(5.0, 5.22), outA = swing(6.05, cut), inB = swing(cut, cut + 0.22);
  ax = W / 2 + (1 - inA) * 1300 - outA * 1400;
  bx = W / 2 + (1 - inB) * 1400;
  const blurA = Math.max(Math.sin(inA * Math.PI), Math.sin(outA * Math.PI)) * 26;
  const blurB = Math.sin(inB * Math.PI) * 26;
  if (t < cut) card(IMG.crowd, ax, cy, cw, ch, -0.03, blurA);
  else card(IMG.reach, bx, cy, cw, ch, 0.03, blurB);
  text("子どもから", W / 2, 1360, 120, pop(t, 5.0 + BEAT));
  text("大人まで、", W / 2, 1510, 120, pop(t, 5.0 + BEAT * 2));
  text("会場全体が笑顔に。", W / 2, 1680, 84, { ...pop(t, 5.0 + BEAT * 3), color: C.moon });
}
function s4(t) {
  // クレーンアップ：写真が下から昇り、星は下へ流れる
  x.fillStyle = C.night; x.fillRect(0, 0, W, H);
  const p = range(t, 7.5, 8.2);
  stars(t, (t - 7.5) * 260);
  floaters(t, 8, 0.45, 33);
  card(IMG.ring, W / 2, 640 + (1 - easeOut(p)) * 900, 960, 640, -0.02);
  // スピードランプ：一気に回って最後だけゆっくり
  const ramp = (a) => { const q = range(t, a, a + 0.55); return 1 - Math.pow(1 - q, 4); };
  const rows = [[8.125, 20, "回以上", "下関市内 開催実績"], [8.75, 5000, "人以上", "延べ来場者数"], [9.375, 13, "会場", "会場・イベントで開催"]];
  rows.forEach(([at, n, unit, label], i) => {
    const y = 1150 + i * 230, a = range(t, at, at + 0.1);
    if (a <= 0) return;
    const v = Math.round(n * ramp(at)).toLocaleString("ja-JP");
    x.save(); x.globalAlpha = a;
    x.font = "900 150px 'Zen Maru Gothic'"; const nw = x.measureText(v).width;
    x.font = "900 64px 'Zen Maru Gothic'"; const uw = x.measureText(unit).width;
    x.restore();
    const left = W / 2 - (nw + uw + 10) / 2;
    text(v, left + nw / 2, y, 150, { a, color: C.moon });
    text(unit, left + nw + 10 + uw / 2, y + 30, 64, { a });
    text(label, W / 2, y + 100, 44, { a, font: "700", stroke: false, color: "#c9ccd4" });
  });
}
function s5(t) {
  // ラックフォーカス：ぼけた泡にピントが合う
  const p = range(t, 10, 12.5);
  cover(IMG.moon1, 1.14 - 0.08 * p, 0, 0, 18 * (1 - easeOut(range(t, 10, 10.9))), 0.15);
  const g = x.createLinearGradient(0, 0, 0, H * 0.5);
  g.addColorStop(0, "rgba(0,0,0,0.65)"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  text("その夜を、", W / 2, 420, 130, pop(t, 10 + BEAT * 2));
  text("きっとずっと", W / 2, 590, 130, pop(t, 10 + BEAT * 2.5));
  richText([["覚えてる", C.moon], ["。", C.paper]], W / 2, 760, 150, pop(t, 10 + BEAT * 3));
}
function s6(t) {
  // 締め：ロゴ・誰に・どう頼むか
  cover(IMG.ojisan, 1.08 - 0.05 * range(t, 12.5, 15), 0, 0, 3, 0.62);
  floaters(t, 14, 0.6, 51);
  const lp = spring(range(t, 12.5, 13.2));
  if (lp > 0) {
    const L = IMG.logo, lw = 600 * lp, lh = lw * L.height / L.width;
    x.save(); x.translate(W / 2, 640); x.rotate(-0.04 * (1 - lp));
    rr(-lw / 2 + 16, -lh / 2 + 16, lw, lh, 36); x.fillStyle = C.moon; x.fill();
    rr(-lw / 2, -lh / 2, lw, lh, 36); x.save(); x.clip(); x.drawImage(L, -lw / 2, -lh / 2, lw, lh); x.restore();
    rr(-lw / 2, -lh / 2, lw, lh, 36); x.lineWidth = 8; x.strokeStyle = C.paper; x.stroke();
    x.restore();
  }
  text("学校・PTA・地域イベントへ", W / 2, 1120, 66, pop(t, 12.5 + BEAT));
  text("出張ナイトバブルショー", W / 2, 1250, 88, { ...pop(t, 12.5 + BEAT * 1.5), color: C.moon });
  // お問い合わせ：カオスやストリートの Instagram DM（本人の指定の言葉どおり）
  text("お気軽に、", W / 2, 1400, 64, { ...pop(t, 12.5 + BEAT * 2), font: "400", fam: "Yusei Magic" });
  const at = 12.5 + BEAT * 2.4;
  tag2(["カオスやストリートの", "インスタグラムDMへ"], W / 2, 1560, range(t, at, at + 0.1), back(range(t, at, at + 0.35)));
  text("Yスタジオ＋ ナイトバブル事業部", W / 2, 1760, 38, { ...pop(t, 12.5 + BEAT * 3), font: "700", stroke: false, color: "#c9ccd4" });
  // 最後に夜へ溶ける
  const f = range(t, 14.3, 15);
  if (f > 0) { x.fillStyle = `rgba(7,9,15,${f})`; x.fillRect(0, 0, W, H); }
}
window.renderAt = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalAlpha = 1; x.filter = "none";
  [s1, s2, s3, s4, s5, s6][Math.min(5, Math.floor(t / BAR))](t);
};
const sl = document.getElementById("t"), tl = document.getElementById("tl");
window.ready.then(() => { renderAt(0); sl.oninput = () => { renderAt(+sl.value); tl.textContent = (+sl.value).toFixed(2) + "s"; }; });
</script>
</body>
</html>
