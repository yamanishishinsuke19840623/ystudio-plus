<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナイトバブル Reels｜はじめての夜</title>
<meta name="description" content="Yスタジオ＋ ナイトバブル事業部のインスタリール用15秒ムービー。子どもと親に向けた、ループする縦型動画。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b22;--gold:#d8b25a;--text:#f4f1e8;--sub:rgba(244,241,232,.62);--line:rgba(244,241,232,.14);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP','Hiragino Sans',sans-serif;line-height:1.8;}
a{color:inherit;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}
header.top{padding:16px 0;border-bottom:1px solid var(--line);}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;}
.brand{font-weight:700;font-size:14px;text-decoration:none;color:var(--gold);}
.back{font-size:12px;color:var(--sub);text-decoration:none;}
.stage{position:relative;margin:20px auto 0;aspect-ratio:9/16;width:min(100%,calc(80vh * 9 / 16));background:#000;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,11,34,.45);border:none;color:var(--text);cursor:pointer;font:inherit;transition:opacity .3s;}
.play .circle{width:72px;height:72px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;padding-left:5px;}
.play .lbl{font-size:12px;letter-spacing:2px;color:var(--sub);}
.play.hidden{opacity:0;pointer-events:none;}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px auto 0;justify-content:center;}
.btn{border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;padding:8px 16px;border-radius:6px;cursor:pointer;text-decoration:none;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
p.note{font-size:12px;color:var(--sub);text-align:center;margin-top:12px;}
footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 0 40px;font-size:11px;color:var(--sub);}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="nightbubble.html">ナイトバブル事業部</a>
  <a class="back" href="nightbubble-reel.html">15秒ムービー（通常版）→</a>
</div></header>
<main class="wrap">
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <button class="play" id="playBtn" type="button" aria-label="音ありで再生">
      <span class="circle">▶</span><span class="lbl">REELS · 15s · LOOP</span>
    </button>
  </div>
  <div class="controls">
    <button class="btn" id="loopBtn" type="button" aria-pressed="true">ループ再生</button>
    <a class="btn" href="nightbubble-reels.mp4">▶ MP4で見る</a>
    <button class="btn" id="safeBtn" type="button" aria-pressed="false">リールの表示位置を重ねる</button>
  </div>
  <p class="note">写真はすべて nightbubble.html に掲載済みのもの。文字は3つだけ、日付なしで通年使える構成です。</p>
</main>
<footer><div class="wrap">© 2025–2026 山西水産株式会社 Yスタジオ＋ ナイトバブル事業部 · <a href="privacy.html">プライバシーポリシー</a></div></footer>

<script>
(() => {
'use strict';
const W = 1080, H = 1920, FPS = 30, DUR = 15;
const CX = W / 2, CY = H / 2;
const BPM = 120, BEAT = 60 / BPM;                 // 0.5s — 30 beats
const C = { bg0: '#070b22', bg1: '#111c4a', navy: '#0f1a44', gold: '#d8b25a', gold2: '#f3dc9a', white: '#f4f1e8', day0: '#8fc8f2', day1: '#fdf1d2', dayInk: '#12204f' };
const SERIF = "'Noto Serif JP', serif", SANS = "'Noto Sans JP', sans-serif", ROMAN = "'Cinzel', serif";
// Reels UI covers roughly the bottom 330px and a 150px column on the right; keep copy inside SAFE.
const SAFE = { x0: 60, x1: W - 150, y0: 220, y1: H - 380 };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const mixHex = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };

// ---------- drawing helpers ----------
function txt(s, x, y, o = {}) {
  ctx.save();
  let size = o.size || 80;
  const font = sz => `${o.weight || 700} ${sz}px ${o.family || SERIF}`;
  ctx.font = font(size); ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { size *= o.maxW / w; ctx.font = font(size); } }
  ctx.fillStyle = o.color || C.white;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 24; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function withClip(x, y, w, h, fn) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); fn(); ctx.restore(); }
function cover(img, x, y, w, h, fx = .5, fy = .5, zoom = 1) {
  if (!img.complete || !img.naturalWidth) return;
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight) * zoom;
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  ctx.drawImage(img, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh);
}

// iridescent soap bubble
function bubble(x, y, r, a = 1, spin = 0, rimOnly = false) {
  if (r < 1 || a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  if (r < 16) {
    ctx.strokeStyle = `hsla(${(x * .3 + y * .2 + spin * 60) % 360},90%,80%,.75)`; ctx.lineWidth = Math.max(1, r * .16);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x - r * .35, y - r * .4, r * .18, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); return;
  }
  const body = ctx.createRadialGradient(x, y, r * .55, x, y, r);
  body.addColorStop(0, 'rgba(255,255,255,0)'); body.addColorStop(.85, 'rgba(180,220,255,.06)'); body.addColorStop(1, 'rgba(255,255,255,.22)');
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  const rim = ctx.createConicGradient(spin, x, y);
  ['#7fe7ff', '#b98cff', '#ff8ad8', '#ffd58a', '#9dffb8', '#7fe7ff'].forEach((c, i, arr) => rim.addColorStop(i / (arr.length - 1), c));
  ctx.strokeStyle = rim; ctx.globalAlpha *= .75; ctx.lineWidth = Math.max(1.5, r * .045);
  ctx.beginPath(); ctx.arc(x, y, r * .985, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha /= .75;
  if (rimOnly) { ctx.restore(); return; }
  const hl = ctx.createRadialGradient(x - r * .38, y - r * .42, 0, x - r * .38, y - r * .42, r * .32);
  hl.addColorStop(0, 'rgba(255,255,255,.9)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .42, r * .3, r * .18, -.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = Math.max(1, r * .03);
  ctx.beginPath(); ctx.arc(x, y, r * .8, .15 * Math.PI, .45 * Math.PI); ctx.stroke();
  ctx.restore();
}
function pop(x, y, r, p) {           // p: 0..1 after the pop
  if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalAlpha = (1 - p);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3 * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(x, y, r * (1 + eOutExpo(p) * .6), 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + r, d = r * (1 + eOutExpo(p) * 1.1);
    ctx.fillStyle = `hsla(${i * 30},90%,80%,1)`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d + p * p * 60, 4 * (1 - p) + 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function sparkle(x, y, s, a) {       // 4-point star like the logo
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.gold2; ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
  ctx.restore();
}
function moon(x, y, r, p) {          // gold crescent, grows in with p
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.35 + (1 - p) * -.6); ctx.scale(p, p);
  ctx.shadowColor = 'rgba(243,220,154,.6)'; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.beginPath(); ctx.rect(-r * 2, -r * 2, r * 4, r * 4); ctx.arc(r * .42, -r * .18, r * .86, 0, Math.PI * 2, true);
  const g = ctx.createLinearGradient(-r, -r, r, r); g.addColorStop(0, '#f7e3a4'); g.addColorStop(.6, C.gold); g.addColorStop(1, '#a8802e');
  ctx.fillStyle = g; ctx.fill('evenodd');
  ctx.restore();
}


// pre-rendered grain
const grain = [];
(() => { const r = rng(7); for (let k = 0; k < 6; k++) { const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d'); const id = gx.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 18; } gx.putImageData(id, 0, 0); grain.push(g); } })();


const load = src => { const i = new Image(); i.src = src; return i; };
// every Night Bubble photo already published on nightbubble.html — fx/fy = focus point for the 9:16 crop
const P = {
  n09: { img: load('kaosuya-nightbubble-09.jpg'), fx: .38, fy: .5 },
  o3: { img: load('otsukimi-3.jpg'), fx: .5, fy: .45 },
  ex: { img: load('kaosuya-nightbubble-ex.jpg'), fx: .5, fy: .5 },
  n03: { img: load('kaosuya-nightbubble-03.jpg'), fx: .55, fy: .5 },
  n01: { img: load('kaosuya-nightbubble-01.jpg'), fx: .5, fy: .5 },
  n04: { img: load('kaosuya-nightbubble-04.jpg'), fx: .45, fy: .5 },
  n06: { img: load('kaosuya-nightbubble-06.jpg'), fx: .6, fy: .5 },
  o2: { img: load('otsukimi-2.jpg'), fx: .5, fy: .5 },
  me: { img: load('shabon-ojisan.jpeg'), fx: .3, fy: .5 },
  n015: { img: load('kaosuya-nightbubble-015.jpg'), fx: .5, fy: .5 },
  o1: { img: load('otsukimi-1.jpg'), fx: .5, fy: .5 },
  me2: { img: load('shabon-ojisan2.jpeg'), fx: .5, fy: .5 },
};
const LOGO = load('nightbubble-logo.png');

const STARS = (() => { const r = rng(11); return Array.from({ length: 160 }, () => ({ x: r() * W, y: r() * H * .85, s: .6 + r() * 1.8, ph: r() * 6 })); })();
const FLOAT = (() => { const r = rng(21); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H, r: 6 + Math.pow(r(), 3) * 70, v: 40 + r() * 80, w: r() * 6, sp: r() * 6 })); })();
const BURST = (() => { const r = rng(33); return Array.from({ length: 160 }, () => { const a = r() * Math.PI * 2, v = 300 + r() * 1400; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4 + Math.pow(r(), 2.5) * 60, w: r() * 6, sp: r() * 6, life: .6 + r() * 1.6 }; }); })();
// ---------- background ----------
function sky(t, day = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex(C.bg0, C.day0, day)); g.addColorStop(1, mixHex(C.bg1, C.day1, day));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (day < 1) STARS.forEach(s => {
    const tw = .45 + .55 * Math.sin(t * 3 + s.ph);
    ctx.fillStyle = `rgba(255,248,225,${tw * (1 - day) * .9})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
}
function floaters(t, a = 1) {
  FLOAT.forEach(b => {
    const y = ((b.y - t * b.v) % (H + 160) + H + 160) % (H + 160) - 80;
    bubble(b.x + Math.sin(t * 1.3 + b.w) * 24, y, b.r, a * .8, b.sp + t * .4);
  });
}


function photo(key, zoom = 1, dim = .18, dx = 0) {
  const p = P[key]; cover(p.img, dx, 0, W, H, p.fx, p.fy, zoom);
  if (dim) { ctx.fillStyle = `rgba(7,11,34,${dim})`; ctx.fillRect(0, 0, W, H); }
}
function burst(t0, t, x, y, a = 1) {
  const lt = t - t0; if (lt < 0 || lt > 2.4) return;
  BURST.forEach(b => {
    if (lt > b.life + .6) return;
    const k = 2.4, d = (1 - Math.exp(-k * lt)) / k;
    bubble(x + b.vx * d + Math.sin(lt * 2 + b.w) * 14, y + b.vy * d - lt * 50, b.r * eOutExpo(prog(lt, 0, .2)), a * (1 - prog(lt, b.life, b.life + .6)), b.sp + lt);
  });
}
function scrim(y0, y1, a = .7) {   // darkens behind copy so it stays readable on any photo
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(7,11,34,0)'); g.addColorStop(.5, `rgba(7,11,34,${a})`); g.addColorStop(1, 'rgba(7,11,34,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
}

// ---------- HERO BUBBLE: the hook frame (also the last frame, so the reel loops seamlessly) ----------
const HERO = { key: 'n09', r: 470, zoom: 1.35 };
const film = document.createElement('canvas'); film.width = film.height = 1100;
function wobPath(x, y, r, u, amp) {
  const p = new Path2D();
  for (let i = 0; i <= 120; i++) {
    const th = i / 120 * Math.PI * 2;
    const rr = r * (1 + amp * (Math.sin(3 * th + u * 5.3) * .6 + Math.sin(5 * th - u * 3.7) * .4));
    const px = x + Math.cos(th) * rr, py = y + Math.sin(th) * rr;
    i ? p.lineTo(px, py) : p.moveTo(px, py);
  }
  p.closePath(); return p;
}
function heroBubble(u, scale = 1, a = 1, amp = .012) {
  const r = HERO.r * scale, x = CX + Math.sin(u * 1.7) * 10, y = CY - 40 + Math.sin(u * 2.4) * 14;
  const path = wobPath(x, y, r, u, amp);
  ctx.save(); ctx.globalAlpha = a;
  // halo
  const halo = ctx.createRadialGradient(x, y, r * .9, x, y, r * 1.45);
  halo.addColorStop(0, 'rgba(150,200,255,.28)'); halo.addColorStop(.5, 'rgba(200,150,255,.1)'); halo.addColorStop(1, 'rgba(150,200,255,0)');
  ctx.fillStyle = halo; ctx.fillRect(x - r * 1.5, y - r * 1.5, r * 3, r * 3);
  // the world inside, refracted: full-frame photo (same framing as the frame after the pop) + a magnified core
  ctx.save(); ctx.clip(path);
  cover(P[HERO.key].img, 0, 0, W, H, P[HERO.key].fx, .5, HERO.zoom);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r * .7, 0, Math.PI * 2); ctx.clip(); ctx.globalAlpha *= .5;
  cover(P[HERO.key].img, 0, 0, W, H, P[HERO.key].fx, .5, HERO.zoom * 1.14); ctx.restore();
  const edge = ctx.createRadialGradient(x, y, r * .55, x, y, r * 1.02);
  edge.addColorStop(0, 'rgba(7,11,34,0)'); edge.addColorStop(1, 'rgba(7,11,34,.6)');
  ctx.fillStyle = edge; ctx.fillRect(x - r * 1.1, y - r * 1.1, r * 2.2, r * 2.2);
  // soap film: two counter-rotating iridescent swirls, strongest near the rim
  const fg = film.getContext('2d'), F = film.width, fc = F / 2, fr = F / 2 - 10;
  fg.globalCompositeOperation = 'source-over'; fg.clearRect(0, 0, F, F);
  [[-.22, .12, u * .7, .5], [.25, -.16, -u * 1.1, .38]].forEach(([ox, oy, ang, al]) => {
    const cg = fg.createConicGradient(ang, fc + ox * fr, fc + oy * fr);
    ['#ff6ad5', '#6ae3ff', '#fff38a', '#8a7dff', '#6affc2', '#ff9a6a', '#ff6ad5'].forEach((c, i, arr) => cg.addColorStop(i / (arr.length - 1), c));
    fg.globalAlpha = al; fg.fillStyle = cg; fg.fillRect(0, 0, F, F);
  });
  fg.globalAlpha = 1; fg.globalCompositeOperation = 'destination-in';
  const m = fg.createRadialGradient(fc, fc, fr * .35, fc, fc, fr);
  m.addColorStop(0, 'rgba(0,0,0,.05)'); m.addColorStop(.75, 'rgba(0,0,0,.35)'); m.addColorStop(1, 'rgba(0,0,0,.95)');
  fg.fillStyle = m; fg.fillRect(0, 0, F, F);
  ctx.globalCompositeOperation = 'screen'; ctx.drawImage(film, x - r, y - r, r * 2, r * 2);
  ctx.restore();
  // rim
  const rim = ctx.createConicGradient(u * .8, x, y);
  ['#9ff0ff', '#c9a2ff', '#ff9ee4', '#ffe29a', '#b4ffcc', '#9ff0ff'].forEach((c, i, arr) => rim.addColorStop(i / (arr.length - 1), c));
  ctx.lineWidth = r * .02; ctx.strokeStyle = rim; ctx.shadowColor = 'rgba(190,220,255,.9)'; ctx.shadowBlur = 30; ctx.stroke(path);
  ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke(path);
  // window reflection (4 panes) + a small kick light, like a real bubble catching a stage light
  ctx.save(); ctx.translate(x - r * .43, y - r * .46); ctx.rotate(-.62); ctx.filter = 'blur(5px)';
  const pw = r * .17, ph = r * .12, gap = r * .03;
  [[-1, -1, .5], [0, -1, .38], [-1, 0, .38], [0, 0, .22]].forEach(([i, j, al]) => {
    const gx = i * (pw + gap) + gap / 2, gy = j * (ph + gap) + gap / 2;
    const lg = ctx.createLinearGradient(gx, gy, gx + pw, gy + ph); lg.addColorStop(0, `rgba(255,255,255,${al})`); lg.addColorStop(1, `rgba(255,255,255,${al * .25})`);
    ctx.fillStyle = lg; ctx.beginPath(); ctx.roundRect(gx, gy, pw, ph, r * .04); ctx.fill();
  });
  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = r * .012; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r * .86, .18 * Math.PI, .36 * Math.PI); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(x + r * .55, y + r * .58, r * .018, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();
  return { x, y, r };
}
// out-of-focus bubbles drifting in front of the lens (depth)
const FRONT = (() => { const r = rng(55); return Array.from({ length: 6 }, (_, i) => ({ y: 200 + r() * (H - 400), r: 70 + r() * 110, v: (i % 2 ? 1 : -1) * (160 + r() * 200), ph: r() * W })); })();
function frontBokeh(u, a = 1) {
  ctx.save(); ctx.filter = 'blur(10px)';
  FRONT.forEach(b => {
    const span = W + b.r * 4, x = ((b.ph + u * b.v) % span + span) % span - b.r * 2;
    bubble(x, b.y + Math.sin(u * 1.5 + b.ph) * 30, b.r, .55 * a, u);
  });
  ctx.restore();
}
function shatter(lt) {
  if (lt < 0 || lt > .8) return;
  const r = rng(77), e = eOutExpo(lt / .8);
  ctx.save(); ctx.lineCap = 'round';

function nightBase(t) { sky(t); [[.2, .16, 16, 0], [.8, .12, 20, .7], [.86, .7, 12, 1.3], [.12, .66, 14, 2]].forEach(([x, y, s, d]) => sparkle(W * x, H * y, s, .5 + .5 * Math.sin(t * 4 + d * 3))); }

// ---------- timeline (beats of 0.5s) ----------
const FAST = ['n09', 'ex', 'o3', 'n03', 'n01', 'n04', 'o2', 'n06'];    // one per beat; the first is the world inside the hero bubble
const SLOW = ['n015', 'o1', 'me2', 'me', 'n09'];                         // two beats each
const T = { pop: 1.5, fastEnd: 5.5, approachEnd: 7.5, slowEnd: 12.5, logoEnd: 14.0 };

function render(t) {

    const r = lerp(90, Math.hypot(W, H) * .6, e), x = lerp(W * .35, CX, e), y = lerp(H * .7, CY, e) + Math.sin(t * 3) * 20 * (1 - e);
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip(); photo('n015', 1.3 - e * .3, .05); ctx.restore();

  const fl = (at, d, col, m) => { const p = (t - at) / d; if (p >= 0 && p <= 1) { ctx.save(); ctx.globalAlpha = (1 - p) * m; ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); } };

  ctx.save(); const f = Math.floor(t * FPS);

  ctx.translate((hash(f) * 256) | 0, (hash(f + 3) * 256) | 0); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  const v = ctx.createRadialGradient(CX, CY, W * .45, CX, CY, Math.hypot(W, H) * .6);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

const logoCut = document.createElement('canvas');
function buildLogo() {
  if (!LOGO.naturalWidth) return;
  const k = LOGO.naturalWidth / 1254;
  logoCut.width = 754; logoCut.height = 730;
  const g = logoCut.getContext('2d');
  g.drawImage(LOGO, 250 * k, 40 * k, 754 * k, 730 * k, 0, 0, 754, 730);
  g.globalCompositeOperation = 'destination-out';
  const F = 60;
  [[0, 0, F, 0, 0, 0, F, 730], [754, 0, 754 - F, 0, 754 - F, 0, F, 730], [0, 0, 0, F, 0, 0, 754, F], [0, 730, 0, 730 - F, 0, 730 - F, 754, F]]
    .forEach(([x0, y0, x1, y1, rx, ry, rw, rh]) => { const m = g.createLinearGradient(x0, y0, x1, y1); m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = m; g.fillRect(rx, ry, rw, rh); });
}

// preview of where Instagram's own UI lands (toggle on the page, never in the export)
let showSafe = false;
function drawSafe() {
  ctx.save(); ctx.fillStyle = 'rgba(255,60,60,.22)';
  ctx.fillRect(0, SAFE.y1, W, H - SAFE.y1); ctx.fillRect(SAFE.x1, 0, W - SAFE.x1, SAFE.y1); ctx.fillRect(0, 0, SAFE.x1, SAFE.y0);
  ctx.restore();
}

// ================= AUDIO =================
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
function buildAudio(ac, t0, dest) {
  const r = rng(1120);
  const master = ac.createGain(); master.gain.value = .55;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp).connect(dest);

  };

    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000;

  osc(B(15), .08, 'square', 1800, 600, .12, .4); noise(B(15), .9, 'lowpass', 8000, 400, .45, .7, .5); osc(B(15), 1.2, 'sine', 80, 32, .8, .3);

async function renderAudioWav() {
  const sr = 48000, len = Math.ceil(sr * (DUR + .01));
  const oac = new OfflineAudioContext(2, len, sr);
  buildAudio(oac, 0, oac.destination);
  const buf = await oac.startRendering();
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));

// ================= player =================
const playBtn = document.getElementById('playBtn'), loopBtn = document.getElementById('loopBtn'), safeBtn = document.getElementById('safeBtn');
let ac = null, start = 0, raf = 0, looping = true;
function loop() {
  let t = ac.currentTime - start;
  if (t >= DUR) {
    if (looping) { start += DUR; buildAudio(ac, start, ac.destination); t -= DUR; }
    else { render(DUR); playBtn.classList.remove('hidden'); playBtn.querySelector('.lbl').textContent = 'REPLAY'; return; }
  }
  render(Math.max(0, t));
  raf = requestAnimationFrame(loop);
}
function play() {
  cancelAnimationFrame(raf);

  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ac = new (window.AudioContext || window.webkitAudioContext)();

  raf = requestAnimationFrame(loop);
}
playBtn.addEventListener('click', play);
loopBtn.addEventListener('click', () => { looping = !looping; loopBtn.setAttribute('aria-pressed', String(looping)); });
safeBtn.addEventListener('click', () => { showSafe = !showSafe; safeBtn.setAttribute('aria-pressed', String(showSafe)); if (!ac) render(3.5); });

const GLYPHS = 'はじめての夜に、なる。その夜を、きっとずっと覚えてる。NIGHTBUBLE';
const fontsReady = Promise.all([`700 100px Cinzel`, `900 100px 'Noto Serif JP'`, `700 100px 'Noto Serif JP'`].map(f => document.fonts.load(f, GLYPHS))).catch(() => {});
const imgs = [...Object.values(P).map(p => p.img), LOGO];
const imgsReady = Promise.all(imgs.map(i => new Promise(res => { if (i.complete) res(); else { i.onload = res; i.onerror = res; } })));
Promise.all([fontsReady, imgsReady]).then(() => { buildLogo(); render(3.5); });

window.__showreel = { render, renderAudioWav, ready: Promise.all([fontsReady, imgsReady, document.fonts.ready]).then(buildLogo), DUR, FPS };
})();
